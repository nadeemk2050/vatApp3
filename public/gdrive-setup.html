<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GDrive Documents — one-time setup</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0f172a; font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; padding:20px; }
  .card { width:100%; max-width:540px; background:#fff; border-radius:16px; padding:26px;
          box-shadow:0 24px 60px rgba(0,0,0,.4); }
  h1 { margin:0 0 6px; font-size:19px; color:#0f172a; }
  p  { margin:0 0 10px; color:#475569; font-size:13px; }
  .row { margin-top:12px; padding:10px 12px; border-radius:10px; font-size:12.5px;
         background:#f1f5f9; color:#334155; border:1px solid #e2e8f0; white-space:pre-line; }
  .ok  { background:#ecfdf5; color:#047857; border-color:#a7f3d0; }
  .bad { background:#fef2f2; color:#b91c1c; border-color:#fecaca; }
  a.btn { display:inline-block; margin-top:16px; padding:10px 16px; border-radius:10px; background:#4f46e5;
          color:#fff; text-decoration:none; font-weight:700; font-size:13px; }
</style>
</head>
<body>
<div class="card">
  <h1>☁️ GDrive Documents</h1>
  <p>First the key is checked with the service. Only a key that works is saved — to this browser and to your account.</p>
  <div id="out" class="row">Checking the link…</div>
  <div id="next"></div>
</div>
<script>
(function () {
  'use strict';
  var STORAGE_KEY = 'vat_gdrive_cfg_v1';
  var DEFAULT_BASE = 'https://whatanagent.duckdns.org';
  var FIREBASE = {
    apiKey: 'AIzaSyDYcZaB5QheUBRHjfXXKQpcflikamoH_Sc',
    authDomain: 'vatapp-c80ce.firebaseapp.com',
    projectId: 'vatapp-c80ce',
    storageBucket: 'vatapp-c80ce.firebasestorage.app',
    messagingSenderId: '853364981272',
    appId: '1:853364981272:web:72989c32f7e1db4c378d6d'
  };
  var APP_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  var AUTH_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

  var out = document.getElementById('out');
  var next = document.getElementById('next');

  function say(text, kind) {
    out.textContent = text;
    out.className = 'row' + (kind ? ' ' + kind : '');
  }

  function showOpen(label) {
    next.innerHTML = '';
    var a = document.createElement('a');
    a.className = 'btn';
    a.href = '/';
    a.textContent = label || 'Open the VAT app';
    next.appendChild(a);
    return a;
  }

  // The key travels in the URL fragment, which browsers never send to a server
  // and never pass on as a referrer. It is erased from the address bar at once.
  var raw = String(location.hash || '').replace(/^#/, '');
  try { history.replaceState(null, '', location.pathname); } catch (e) { /* file:// */ }

  var params = new URLSearchParams(raw);
  var cfg = {
    base: (params.get('base') || DEFAULT_BASE).trim(),
    key: (params.get('key') || '').trim(),
    serial: (params.get('serial') || '').trim(),
    maxMb: 25
  };

  if (!cfg.key || !cfg.serial) {
    say('This link is missing the API key or the client serial.\n' +
      'Open Settings → GDrive Documents in the app and paste them there instead.', 'bad');
    showOpen();
    return;
  }

  // Save in the signed-in user's own Firestore document, so other devices pick
  // it up automatically. Never fatal: the local copy is enough.
  async function saveToAccount() {
    var appMod = await import(APP_SDK);
    var authMod = await import(AUTH_SDK);
    var apps = appMod.getApps ? appMod.getApps() : [];
    var app = apps.length ? apps[0] : appMod.initializeApp(FIREBASE);
    var auth = authMod.getAuth(app);

    var user = auth.currentUser;
    if (!user) {
      user = await new Promise(function (resolve) {
        var settled = false;
        var unsub = authMod.onAuthStateChanged(auth, function (u) {
          if (settled) return;
          settled = true;
          try { unsub(); } catch (e) { /* ignore */ }
          resolve(u || null);
        });
        setTimeout(function () {
          if (settled) return;
          settled = true;
          try { unsub(); } catch (e) { /* ignore */ }
          resolve(auth.currentUser || null);
        }, 4000);
      });
    }
    if (!user) return { signedIn: false };

    var token = await user.getIdToken();
    var url = 'https://firestore.googleapis.com/v1/projects/' + FIREBASE.projectId +
      '/databases/(default)/documents/users/' + encodeURIComponent(user.uid) + '/appSettings/gdrive';
    var res = await fetch(url, {
      method: 'PATCH',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        fields: {
          base: { stringValue: cfg.base },
          key: { stringValue: cfg.key },
          serial: { stringValue: cfg.serial },
          maxMb: { integerValue: '25' },
          updatedAt: { integerValue: String(Date.now()) },
          updatedBy: { stringValue: String(user.email || user.uid) }
        }
      })
    });
    if (!res.ok) throw new Error('account save returned HTTP ' + res.status);
    return { signedIn: true };
  }

  say('Checking the key with the service…');

  fetch(cfg.base.replace(/\/+$/, '') + '/api/v1/gdrive/me', {
    headers: { 'x-api-key': cfg.key, 'x-client-serial': cfg.serial },
    cache: 'no-store'
  })
    .then(function (res) {
      return res.json()
        .catch(function () { return {}; })
        .then(function (body) { return { status: res.status, body: body }; });
    })
    .catch(function (e) { return { status: 0, body: null, error: (e && e.message) || String(e) }; })
    .then(function (r) {
      // ── verified: now, and only now, store it ──────────────────────────
      if (r.body && r.body.ok === true) {
        var c = r.body.client || {};
        var d = r.body.drive || {};

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
        } catch (e) {
          say('Verified, but this browser refused to store it (private mode?). ' +
            'Paste the key in Settings → GDrive Documents instead.', 'bad');
          showOpen();
          return;
        }

        say('✅ Connected as "' + (c.name || 'client') + '" — folder: ' + (c.folder_name || '—') +
          (d.email ? ' · drive: ' + d.email : '') + '.\nSaving to your account…', 'ok');

        return saveToAccount()
          .then(function (acct) {
            var note = acct.signedIn
              ? '\n✅ Saved to your account too — every browser and PC gets it after sign-in.'
              : '\nℹ️ You are not signed in here, so this applies to this browser only. ' +
                'Sign in, then open this link again to stamp it on your account.';
            say('✅ Connected as "' + (c.name || 'client') + '" — folder: ' + (c.folder_name || '—') +
              (d.email ? ' · drive: ' + d.email : '') + '.' + note, 'ok');
          })
          .catch(function (e) {
            say('✅ Connected and saved in this browser. The account copy failed (' +
              ((e && e.message) || e) + '), so other devices will still ask once.', 'ok');
          })
          .then(function () {
            showOpen('Open the VAT app');
            setTimeout(function () { location.replace('/'); }, 2200);
          });
      }

      // ── rejected: store nothing, so a bad key never spreads ────────────
      var why = (r.body && r.body.error) || (r.error ? ('network: ' + r.error) : ('HTTP ' + r.status));
      var advice = /invalid api key/i.test(why)
        ? '\nNothing was saved. That key is not valid any more — it was probably replaced by the "New key" button. ' +
          'Copy the current key from the service page (API clients → New key) and open a fresh setup link.'
        : (r.error
          ? '\nNothing was saved. Check the network and try again.'
          : '\nNothing was saved.');
      say('❌ ' + why + '.' + advice, 'bad');
      showOpen('Open the VAT app anyway');
    });
})();
</script>
</body>
</html>
