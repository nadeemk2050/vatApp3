<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GDrive Documents — one-time setup</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0f172a; font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; padding:20px; }
  .card { width:100%; max-width:520px; background:#fff; border-radius:16px; padding:26px;
          box-shadow:0 24px 60px rgba(0,0,0,.4); }
  h1 { margin:0 0 6px; font-size:19px; color:#0f172a; }
  p  { margin:0 0 10px; color:#475569; font-size:13px; }
  .row { margin-top:12px; padding:10px 12px; border-radius:10px; font-size:12.5px;
         background:#f1f5f9; color:#334155; border:1px solid #e2e8f0; }
  .ok  { background:#ecfdf5; color:#047857; border-color:#a7f3d0; }
  .bad { background:#fef2f2; color:#b91c1c; border-color:#fecaca; }
  code { font-family:ui-monospace,Consolas,monospace; font-size:12px; }
  a.btn { display:inline-block; margin-top:16px; padding:10px 16px; border-radius:10px; background:#4f46e5;
          color:#fff; text-decoration:none; font-weight:700; font-size:13px; }
</style>
</head>
<body>
<div class="card">
  <h1>☁️ GDrive Documents</h1>
  <p>This page saves the service connection for <b>this browser</b> and then opens the VAT app.</p>
  <div id="out" class="row">Checking the link…</div>
  <div id="next"></div>
</div>
<script>
(function () {
  'use strict';
  var STORAGE_KEY = 'vat_gdrive_cfg_v1';
  var DEFAULT_BASE = 'https://whatanagent.duckdns.org';
  var out = document.getElementById('out');
  var next = document.getElementById('next');

  function say(text, kind) {
    out.textContent = text;
    out.className = 'row' + (kind ? ' ' + kind : '');
  }

  // The key travels in the URL fragment, which browsers never send to a server
  // and never pass on as a referrer. It is erased from the address bar at once.
  var raw = String(location.hash || '').replace(/^#/, '');
  try { history.replaceState(null, '', location.pathname); } catch (e) { /* file:// */ }

  var params = new URLSearchParams(raw);
  var cfg = {
    base: (params.get('base') || DEFAULT_BASE).trim(),
    key: (params.get('key') || '').trim(),
    serial: (params.get('serial') || '').trim(),
    maxMb: 25
  };

  if (!cfg.key || !cfg.serial) {
    say('This link is missing the API key or the client serial. Open Settings → GDrive Documents in the app and paste them there instead.', 'bad');
    next.innerHTML = '<a class="btn" href="/">Open the app</a>';
    return;
  }

  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
  } catch (e) {
    say('The browser refused to store the settings (private mode?). Paste them manually in Settings → GDrive Documents.', 'bad');
    next.innerHTML = '<a class="btn" href="/">Open the app</a>';
    return;
  }

  say('Saved. Checking the connection…', '');

  fetch(cfg.base.replace(/\/+$/, '') + '/api/v1/gdrive/me', {
    headers: { 'x-api-key': cfg.key, 'x-client-serial': cfg.serial }
  })
    .then(function (res) { return res.json().then(function (body) { return { status: res.status, body: body }; }); })
    .then(function (r) {
      if (!r.body || r.body.ok !== true) {
        say('Saved, but the service said: ' + ((r.body && r.body.error) || ('HTTP ' + r.status)) +
          '. The key may have been revoked — you can replace it in Settings.', 'bad');
        next.innerHTML = '<a class="btn" href="/">Open the app anyway</a>';
        return;
      }
      var c = r.body.client || {};
      var d = r.body.drive || {};
      say('✅ Connected as "' + (c.name || 'client') + '" — folder: ' + (c.folder_name || '—') +
        (d.email ? ' · drive: ' + d.email : '') +
        '. Everything is ready: new voucher documents now go to Google Drive.', 'ok');
      next.innerHTML = '<a class="btn" href="/">Open the VAT app</a>';
      setTimeout(function () { location.replace('/'); }, 1500);
    })
    .catch(function (e) {
      say('Saved in this browser, but the service could not be reached right now (' +
        (e && e.message ? e.message : e) + '). It will work once the network is back.', 'bad');
      next.innerHTML = '<a class="btn" href="/">Open the app</a>';
    });
})();
</script>
</body>
</html>
